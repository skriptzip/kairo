# Kairo sync server on MariaDB.
#   docker compose -f docker-compose.mariadb.yml up -d
services:
  kairo:
    image: ghcr.io/skriptzip/kairo:latest
    restart: unless-stopped
    ports:
      # Only reachable from this machine; put a TLS reverse proxy in front for remote use
      # (and set KAIRO_TRUST_PROXY: "1" below).
      - "127.0.0.1:8080:8080"
    environment:
      KAIRO_DATABASE_URL: mariadb://kairo:${DB_PASSWORD:?set DB_PASSWORD}@db/kairo
      KAIRO_REGISTRATION: open
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_USER: kairo
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MARIADB_DATABASE: kairo
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

volumes:
  db-data:
