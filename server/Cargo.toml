[package]
name = "kairo-server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# One code base for SQLite, PostgreSQL and MariaDB/MySQL (`any` driver, rustls so the image needs no OpenSSL).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "any", "sqlite", "postgres", "mysql"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
