# Kairo sync server with the built-in SQLite database (data lives in the `kairo-data` volume).
#   docker compose up -d
# With PostgreSQL or MariaDB instead:
#   docker compose -f docker-compose.postgres.yml up -d
#   docker compose -f docker-compose.mariadb.yml up -d
services:
  kairo:
    image: ghcr.io/skriptzip/kairo:latest
    restart: unless-stopped
    ports:
      # Only reachable from this machine; put a TLS reverse proxy in front for remote use
      # (and set KAIRO_TRUST_PROXY: "1" below).
      - "127.0.0.1:8080:8080"
    environment:
      KAIRO_REGISTRATION: open # or closed
      # KAIRO_INVITE_CODE: change-me
    volumes:
      - kairo-data:/data

volumes:
  kairo-data:
