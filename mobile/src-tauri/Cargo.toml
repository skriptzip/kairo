[package]
name = "kairo-mobile"
version = "0.1.0"
edition = "2024"

# Its own workspace: built by the Tauri CLI, not as part of the desktop app.
[workspace]

[lib]
name = "kairo_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
kairo-core = { path = "../../core", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
