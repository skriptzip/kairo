[package]
name = "kairo"
version = "0.1.0"
edition = "2024"

# The sync server (`server/`) and the mobile app (`mobile/`) are built on their own
# (Docker image / Tauri CLI, separate lockfiles).
[workspace]
members = ["core"]
exclude = ["server", "mobile/src-tauri"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
gpui-kit = "0.6"
kairo-core = { path = "core" }
notify-rust = "4.18.2"
outlook-pst = { path = "vendor/outlook-pst" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

# Used by `cargo bundle` (macOS .app, Linux .deb) — https://github.com/burtonageo/cargo-bundle
[package.metadata.bundle]
name = "Kairo"
identifier = "de.kairo.app"
icon = ["assets/icon.png", "assets/icon.icns"]
category = "Productivity"
short_description = "Kairo Kalender"
