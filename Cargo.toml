[package]
name = "kairo"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
gpui-kit = "0.6"
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1.27.0", features = ["v4"] }
